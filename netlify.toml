# Netlify build config — Next.js App Router site (migrated off Vercel).
#
# The Next runtime (@netlify/plugin-nextjs) is auto-installed by Netlify when it
# detects Next.js: it compiles app/ routes + API handlers into Netlify Functions
# (Node/Lambda) and serves the static/ISR output. Security headers, redirects and
# the /api/leads/track rewrite are all defined in next.config.mjs, so they carry
# over automatically — nothing to duplicate here.
#
# NOTE: do NOT re-add `publish = "."` or a `/* -> /index.html` redirect. That was
# the old pre-Next static config, and it makes Netlify serve the repo root as flat
# files so the Next build is never served — a blank/404 deploy with no error.
[build]
  command = "next build"
  publish = ".next"

# ⚠️ DECLARE THIS EXPLICITLY — do not rely on auto-detection.
# Netlify detects the framework (deploys report framework: "next") but that is
# NOT the same as installing the runtime, and a CI build reported
# plugins: "none" while succeeding: it published the raw .next directory as flat
# static files, so every route 404'd on a green build with no error anywhere.
# A local `netlify deploy --build` does NOT reproduce it — the CLI applies the
# plugin itself, so local deploys worked while CI served 404s.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  # Pinned because the local machine runs Node 26, which Netlify's build image
  # does not offer — without this the build picks Netlify's default and the
  # version that ships is not the one this was tested on. 22 is LTS and is what
  # Next 14 targets.
  NODE_VERSION = "22"
